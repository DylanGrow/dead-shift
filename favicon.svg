<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#050b14"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Circle Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <circle cx="256" cy="256" r="230" fill="none" stroke="#06b6d4" stroke-width="16" filter="url(#glow)"/>

  <!-- Crosshair Ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#ef4444" stroke-width="8" stroke-dasharray="24 16" opacity="0.8"/>

  <!-- Skull Icon / Biohazard Threat Vector -->
  <g transform="translate(256, 256) scale(1.4)" filter="url(#glow)">
    <!-- Skull Head -->
    <path d="M-60,-30 C-60,-80 60,-80 60,-30 C60,10 40,30 30,50 L-30,50 C-40,30 -60,10 -60,-30 Z" fill="#ef4444"/>
    <!-- Teeth -->
    <rect x="-24" y="50" width="10" height="20" rx="3" fill="#ffffff"/>
    <rect x="-8" y="50" width="10" height="20" rx="3" fill="#ffffff"/>
    <rect x="8" y="50" width="10" height="20" rx="3" fill="#ffffff"/>
    <rect x="24" y="50" width="10" height="20" rx="3" fill="#ffffff"/>
    <!-- Eye Sockets -->
    <circle cx="-25" cy="-25" r="18" fill="#050b14"/>
    <circle cx="25" cy="-25" r="18" fill="#050b14"/>
    <!-- Glowing Pupils -->
    <circle cx="-25" cy="-25" r="7" fill="#38bdf8"/>
    <circle cx="25" cy="-25" r="7" fill="#38bdf8"/>
    <!-- Nose Hole -->
    <polygon points="0,-5 -10,12 10,12" fill="#050b14"/>
  </g>
</svg>
